name: Release Preview

# Provenance gate: shows EXACTLY which packages and versions would publish,
# on a clean checkout, without publishing anything. Run before a release.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  preview:
    if: github.repository_owner == 'tpmjs'
    name: Preview what would publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test release policy and external contracts
        run: |
          pnpm release:audit:test
          pnpm release:auth:test
          pnpm verify:vercel-api:test
          pnpm verify:vercel-api

      - name: Show pending Changesets releases
        run: |
          set -o pipefail
          pnpm release:status | tee release-status.txt

      - name: Audit npm release plan
        run: |
          set +e
          pnpm release:audit --format markdown --output release-audit.md --json-output release-audit.json
          audit_status=$?
          set -e
          cat release-audit.md >> "$GITHUB_STEP_SUMMARY"
          exit "$audit_status"

      - name: Upload machine-readable release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-${{ github.sha }}
          path: |
            release-status.txt
            release-audit.md
            release-audit.json
          if-no-files-found: error
