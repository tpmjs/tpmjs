name: Auto-Fix Production Error

on:
  # NOTE: automatic triggers disabled 2026-06-13 — uncomment below to re-enable
  # issues:
  #   types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

jobs:
  auto-fix:
    if: github.repository_owner == 'tpmjs' && (github.event.label.name == 'auto-fix' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Check for retry loop
        id: loop-check
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};
            const events = await github.rest.issues.listEvents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const autoFixLabelEvents = events.data.filter(
              e => e.event === 'labeled' && e.label?.name === 'auto-fix'
            );

            if (autoFixLabelEvents.length >= 2) {
              // Too many retries — escalate
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'auto-fix'
              }).catch(() => {});

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-human-review']
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '## Auto-fix limit reached\n\nThis issue has been through 2+ auto-fix attempts without resolution. Escalating to human review.\n\nPlease investigate manually and remove the `needs-human-review` label when resolved.'
              });

              core.setOutput('should_continue', 'false');
              return;
            }

            core.setOutput('should_continue', 'true');

      - name: Add working label
        if: steps.loop-check.outputs.should_continue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['claude-working']
            });

      - name: Build prompt from issue
        if: steps.loop-check.outputs.should_continue == 'true'
        id: build-prompt
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const prompt = [
              'Please fix this production error.',
              '',
              '## Instructions',
              '1. Read the pipeline specification at `.claude/pipelines/auto-fix.md`',
              '2. Follow all steps: parse error, locate source, analyze, fix, validate, create PR',
              '3. **IMPORTANT:** Include `Fixes #' + issueNumber + '` in the PR body so the issue auto-closes on merge',
              '4. **IMPORTANT:** After creating the PR, merge it immediately with `gh pr merge <PR_NUMBER> --squash --delete-branch`',
              '5. Update labels as you progress (remove `claude-working`, add `fix-submitted` or `needs-human-review`)',
              '6. Post a summary comment with your findings and the PR link',
              '',
              '## Issue Context',
              `- Issue #${issueNumber}`,
              `- Author: @${issue.user.login}`,
              `- Labels: ${issue.labels.map(l => l.name).join(', ')}`,
              '',
              '## Issue Body',
              issue.body,
              '',
              'Begin analysis and fix.'
            ].join('\n');

            core.setOutput('prompt', prompt);

      - name: Checkout repository
        if: steps.loop-check.outputs.should_continue == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.loop-check.outputs.should_continue == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: ${{ steps.build-prompt.outputs.prompt }}
          claude_args: '--allowedTools "Edit" "Write" "Bash(gh:*)" "Bash(npm:*)" "Bash(pnpm:*)" "Bash(git:*)" "Bash(npx:*)"'

      - name: Notify Discord
        if: always() && steps.loop-check.outputs.should_continue == 'true'
        uses: actions/github-script@v7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        with:
          script: |
            const issueNumber = context.issue?.number || ${{ inputs.issue_number || 0 }};
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const labels = issue.labels.map(l => l.name);
            const fixSubmitted = labels.includes('fix-submitted');
            const needsHuman = labels.includes('needs-human-review');

            // Find linked PR from issue comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 10
            });
            const prMatch = comments
              .map(c => c.body?.match(/https:\/\/github\.com\/tpmjs\/tpmjs\/pull\/(\d+)/))
              .find(m => m);
            const prUrl = prMatch ? prMatch[0] : null;

            // Check if issue was closed (meaning PR was merged with Fixes #N)
            const isClosed = issue.state === 'closed';

            let message;
            if (fixSubmitted && prUrl && isClosed) {
              message = `**Auto-fix merged** for production error ✅\n\n` +
                `**Error:** ${issue.title.replace('[Sentry] ', '')}\n` +
                `**Issue:** https://github.com/tpmjs/tpmjs/issues/${issueNumber}\n` +
                `**PR:** ${prUrl}\n\n` +
                `Claude analyzed, fixed, and merged automatically.`;
            } else if (fixSubmitted && prUrl) {
              message = `**Auto-fix PR created** for production error\n\n` +
                `**Error:** ${issue.title.replace('[Sentry] ', '')}\n` +
                `**Issue:** https://github.com/tpmjs/tpmjs/issues/${issueNumber}\n` +
                `**PR:** ${prUrl}\n\n` +
                `Claude created a fix PR (merge may need manual approval).`;
            } else if (needsHuman) {
              message = `**Auto-fix needs human review** ⚠️\n\n` +
                `**Error:** ${issue.title.replace('[Sentry] ', '')}\n` +
                `**Issue:** https://github.com/tpmjs/tpmjs/issues/${issueNumber}\n\n` +
                `Claude couldn't fix this automatically — needs manual investigation.`;
            } else {
              message = `**Auto-fix completed** for production error\n\n` +
                `**Error:** ${issue.title.replace('[Sentry] ', '')}\n` +
                `**Issue:** https://github.com/tpmjs/tpmjs/issues/${issueNumber}\n` +
                `**Workflow:** https://github.com/tpmjs/tpmjs/actions/runs/${{ github.run_id }}`;
            }

            const channelId = '1442666515425132644';
            await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
              method: 'POST',
              headers: {
                Authorization: `Bot ${process.env.DISCORD_BOT_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ content: message }),
            });
