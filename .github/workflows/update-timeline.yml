name: Update Timeline Data

on:
  # NOTE: automatic triggers disabled 2026-06-13 — uncomment below to re-enable
  # schedule:
  #   - cron: '0 6 * * *' # Daily at 6am UTC
  workflow_dispatch: # Allow manual runs

concurrency:
  group: update-timeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build timeline data
        run: node scripts/build-timeline.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet apps/web/public/timeline-data.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/timeline-data.json
          git commit -m "chore: update timeline data [skip ci]"
          git push
