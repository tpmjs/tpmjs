name: Sync NPM Changes Feed

on:
  # NOTE: automatic triggers disabled 2026-06-13 — uncomment below to re-enable
  # schedule:
  #   # Run every 2 minutes
  #   - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  sync-changes:
    if: github.repository_owner == 'tpmjs'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger changes feed sync
        run: |
          curl -X POST "${{ secrets.VERCEL_PRODUCTION_URL }}/api/sync/changes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -f -s -S -w "\nHTTP Status: %{http_code}\n"
