name: Vercel API Contract

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/tools/official/vercel/**'
      - 'scripts/vercel-contract-lib.ts'
      - 'scripts/vercel-contract.test.ts'
      - 'scripts/verify-vercel-api.ts'
      - '.github/workflows/vercel-api-contract.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository_owner == 'tpmjs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test contract verifier
        run: pnpm verify:vercel-api:test

      - name: Compare tools with the current Vercel OpenAPI document
        run: pnpm verify:vercel-api
