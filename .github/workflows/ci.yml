name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validation_provenance:
    name: Validation provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.provenance.outputs.reuse }}
      source_run_id: ${{ steps.provenance.outputs.source_run_id }}
      build_baseline_available: ${{ steps.build_baseline.outputs.cache-matched-key != '' }}
      build_refresh_required: ${{ steps.delta_budget.outputs.refresh-required }}
    env:
      MAX_PROMOTED_TURBO_DELTA_BYTES: 134217728
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Find exact successful pull-request validation
        id: provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reuse-pr-validation.mjs

      - name: Import TypeScript state from validated pull request
        id: typescript_state
        if: steps.provenance.outputs.reuse == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pr-compiler-state-typescript
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ steps.provenance.outputs.source_run_id }}

      - name: Promote validated TypeScript state to main cache scope
        if: steps.typescript_state.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            .turbo
            apps/*/tsconfig.tsbuildinfo
            apps/*/.next/cache/tsconfig.tsbuildinfo
            packages/*/tsconfig.tsbuildinfo
            packages/tools/*/tsconfig.tsbuildinfo
            packages/tools/official/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-typescript-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Locate reusable main build baseline
        id: build_baseline
        if: steps.provenance.outputs.reuse == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            apps/web/.next/cache
            .turbo
          key: ${{ runner.os }}-build-baseline-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-baseline-v2-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-build-${{ hashFiles('pnpm-lock.yaml') }}-
          lookup-only: true

      - name: Import build delta from validated pull request
        id: build_delta
        if: >-
          steps.provenance.outputs.reuse == 'true' &&
          steps.build_baseline.outputs.cache-matched-key != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pr-compiler-state-build
          path: .ci/compiler-state-build
          github-token: ${{ github.token }}
          run-id: ${{ steps.provenance.outputs.source_run_id }}

      - name: Bound the promoted Turbo delta
        id: delta_budget
        if: steps.build_delta.outcome == 'success'
        run: |
          if ! stats="$(node scripts/compiler-cache-delta.mjs inspect .ci/compiler-state-build)"; then
            echo 'Validated Turbo delta is invalid; refreshing the complete baseline'
            echo 'promotable=false' >> "$GITHUB_OUTPUT"
            echo 'refresh-required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bytes="$(jq -r '.bytes' <<< "$stats")"
          echo "Validated Turbo delta: $bytes bytes"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          if [ "$bytes" -le "$MAX_PROMOTED_TURBO_DELTA_BYTES" ]; then
            echo 'promotable=true' >> "$GITHUB_OUTPUT"
            echo 'refresh-required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'promotable=false' >> "$GITHUB_OUTPUT"
            echo 'refresh-required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Promote validated Turbo delta to main cache scope
        if: steps.delta_budget.outputs.promotable == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ci/compiler-state-build
          key: ${{ runner.os }}-turbo-build-delta-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  lint:
    needs: validation_provenance
    if: ${{ always() && (github.event_name != 'push' || needs.validation_provenance.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint --affected --output-logs=new-only

      - name: Format check
        run: pnpm format:check

      - name: Validate operator scripts
        run: |
          bash -n scripts/deploy-on-box.sh
          docker compose --file compose.dev.yaml config --quiet

  type-check:
    needs: validation_provenance
    if: ${{ always() && (github.event_name != 'push' || needs.validation_provenance.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Restore incremental TypeScript state
        uses: actions/cache@v5
        with:
          path: |
            .turbo
            apps/*/tsconfig.tsbuildinfo
            apps/*/.next/cache/tsconfig.tsbuildinfo
            packages/*/tsconfig.tsbuildinfo
            packages/tools/*/tsconfig.tsbuildinfo
            packages/tools/official/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-typescript-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-typescript-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: |
          affected_count="$(pnpm exec turbo ls --affected --output=json | jq '.packages.count')"
          if [ "$affected_count" -eq 0 ]; then
            echo 'No workspaces require type checking'
            exit 0
          fi
          pnpm exec turbo run type-check --affected

      - name: Export validated TypeScript state
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-compiler-state-typescript
          path: |
            .turbo
            apps/*/tsconfig.tsbuildinfo
            apps/*/.next/cache/tsconfig.tsbuildinfo
            packages/*/tsconfig.tsbuildinfo
            packages/tools/*/tsconfig.tsbuildinfo
            packages/tools/official/*/tsconfig.tsbuildinfo
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1
          compression-level: 1

  type-coverage:
    needs: validation_provenance
    if: ${{ always() && (github.event_name != 'push' || needs.validation_provenance.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Restore incremental type-coverage analysis
        uses: actions/cache@v5
        with:
          path: .type-coverage
          key: ${{ runner.os }}-type-coverage-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json', 'scripts/type-coverage.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-type-coverage-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json', 'scripts/type-coverage.ts') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce type coverage
        run: pnpm type-coverage

  test:
    needs: validation_provenance
    if: ${{ always() && (github.event_name != 'push' || needs.validation_provenance.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test repository contracts
        run: |
          pnpm dev:setup:test
          pnpm sync:manual:test
          pnpm release:audit:test
          pnpm release:auth:test
          pnpm release:build:test
          pnpm release:exclude-private:test
          node --test scripts/reuse-pr-validation.test.mjs
          node --test scripts/compiler-cache-delta.test.mjs

      - name: Plan dependency-aware coverage
        id: coverage_plan
        run: |
          task_count="$(pnpm exec turbo run test:coverage --affected --dry=json | jq '.tasks | length')"
          echo "Selected coverage tasks: $task_count"
          if [ "$task_count" -eq 0 ]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Test packages and enforce coverage
        id: coverage
        if: steps.coverage_plan.outputs.required == 'true'
        run: pnpm test:coverage

      - name: Preserve test coverage report
        if: always() && steps.coverage_plan.outputs.required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage
          path: coverage/
          if-no-files-found: error

  migrations:
    needs: validation_provenance
    if: ${{ always() && (github.event_name != 'push' || needs.validation_provenance.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tpmjs
          POSTGRES_PASSWORD: tpmjs
          POSTGRES_DB: tpmjs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpmjs -d tpmjs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tpmjs:tpmjs@127.0.0.1:5432/tpmjs_ci
      DATABASE_URL_UNPOOLED: postgresql://tpmjs:tpmjs@127.0.0.1:5432/tpmjs_ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove fresh migration history
        run: pnpm --filter @tpmjs/web exec prisma migrate deploy --schema ../../packages/db/prisma/schema.prisma

      - name: Prove registry counter invariants
        run: pnpm --filter @tpmjs/db db:verify-counter-invariants

      - name: Reject schema drift
        run: >-
          pnpm --filter @tpmjs/web exec prisma migrate diff
          --from-schema-datasource ../../packages/db/prisma/schema.prisma
          --to-schema-datamodel ../../packages/db/prisma/schema.prisma
          --exit-code

  build:
    needs: validation_provenance
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'push' ||
          needs.validation_provenance.outputs.reuse != 'true' ||
          needs.validation_provenance.outputs.build_baseline_available != 'true' ||
          needs.validation_provenance.outputs.build_refresh_required == 'true'
        )
      }}
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      BUILD_REFRESH_REQUIRED: ${{ needs.validation_provenance.outputs.build_refresh_required }}
      MAX_PROMOTED_TURBO_DELTA_BYTES: 134217728
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Restore reusable main build baseline
        id: build_baseline
        uses: actions/cache/restore@v5
        with:
          path: |
            apps/web/.next/cache
            .turbo
          key: ${{ runner.os }}-build-baseline-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-baseline-v2-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-build-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Snapshot inherited Turbo build state
        run: >-
          node scripts/compiler-cache-delta.mjs snapshot
          .turbo/cache .ci/build-cache-before.json

      - name: Restore latest promoted Turbo build delta
        id: inherited_build_delta
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .ci/compiler-state-build
          key: ${{ runner.os }}-turbo-build-delta-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-delta-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Apply promoted Turbo build delta
        if: steps.inherited_build_delta.outputs.cache-matched-key != ''
        continue-on-error: true
        run: >-
          node scripts/compiler-cache-delta.mjs apply
          .ci/compiler-state-build .turbo/cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          BUILD_BASELINE_MATCHED_KEY: ${{ steps.build_baseline.outputs.cache-matched-key }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'push' ] && { [ -z "$BUILD_BASELINE_MATCHED_KEY" ] || [ "$BUILD_REFRESH_REQUIRED" = 'true' ]; }; then
            echo 'Seeding or refreshing the complete main build baseline'
            pnpm exec turbo run build
            exit 0
          fi
          affected_count="$(pnpm exec turbo ls --affected --output=json | jq '.packages.count')"
          if [ "$affected_count" -eq 0 ]; then
            echo 'No workspaces require building'
            exit 0
          fi
          pnpm exec turbo run build --affected

      - name: Prepare validated Turbo build delta
        id: prepared_build_delta
        if: >-
          github.event_name == 'pull_request' ||
          (
            github.event_name == 'push' &&
            steps.build_baseline.outputs.cache-matched-key != '' &&
            env.BUILD_REFRESH_REQUIRED != 'true'
          )
        run: >-
          node scripts/compiler-cache-delta.mjs collect
          .turbo/cache .ci/build-cache-before.json .ci/compiler-state-build

      - name: Measure prepared Turbo build delta
        id: prepared_delta_budget
        if: steps.prepared_build_delta.outcome == 'success'
        run: |
          if ! stats="$(node scripts/compiler-cache-delta.mjs inspect .ci/compiler-state-build)"; then
            echo 'Prepared Turbo delta is invalid; refreshing the complete baseline when on main'
            echo 'promotable=false' >> "$GITHUB_OUTPUT"
            echo 'refresh-required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bytes="$(jq -r '.bytes' <<< "$stats")"
          echo "Prepared Turbo delta: $bytes bytes"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          if [ "$bytes" -le "$MAX_PROMOTED_TURBO_DELTA_BYTES" ]; then
            echo 'promotable=true' >> "$GITHUB_OUTPUT"
            echo 'refresh-required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'promotable=false' >> "$GITHUB_OUTPUT"
            echo 'refresh-required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh complete build state after an oversized direct-push delta
        if: >-
          github.event_name == 'push' &&
          steps.prepared_delta_budget.outputs.refresh-required == 'true'
        run: pnpm exec turbo run build

      - name: Seed reusable main build baseline
        if: >-
          github.event_name == 'push' &&
          (
            steps.build_baseline.outputs.cache-matched-key == '' ||
            env.BUILD_REFRESH_REQUIRED == 'true' ||
            steps.prepared_delta_budget.outputs.refresh-required == 'true'
          )
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            apps/web/.next/cache
            .turbo
          key: ${{ runner.os }}-build-baseline-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Promote direct-push Turbo delta
        if: >-
          github.event_name == 'push' &&
          steps.prepared_delta_budget.outputs.promotable == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ci/compiler-state-build
          key: ${{ runner.os }}-turbo-build-delta-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Export validated build state
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-compiler-state-build
          path: .ci/compiler-state-build/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  executor:
    needs: validation_provenance
    if: ${{ always() && (github.event_name != 'push' || needs.validation_provenance.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and type-check the production executor image
        run: |
          printf 'commit=%s\nmessage=CI %s\n' "$GITHUB_SHA" "$GITHUB_SHA" \
            > apps/railway-executor/.tpmjs-release-provenance
          docker build \
            --build-arg "COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "COMMIT_MESSAGE=CI ${GITHUB_SHA}" \
            -t tpmjs-executor:ci apps/railway-executor

      - name: Verify typed protocol at runtime
        run: |
          docker run -d --name tpmjs-executor-ci -p 3002:3002 \
            -e EXECUTOR_API_KEY=ci-executor-key tpmjs-executor:ci
          trap 'docker rm -f tpmjs-executor-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/health > /tmp/executor-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs tpmjs-executor-ci
              exit 1
            fi
            sleep 1
          done

          jq --arg commit "$GITHUB_SHA" --exit-status '
            .status == "ok" and
            .protocolVersion == "1.1" and
            .implementationVersion == $commit
          ' /tmp/executor-health.json

          curl --silent --output /tmp/executor-auth.json \
            --write-out '%{http_code}' \
            --request POST http://127.0.0.1:3002/execute-tool \
            --header 'Content-Type: application/json' \
            --data '{}' | grep --quiet '^401$'
          jq --exit-status '
            .success == false and
            .errorStage == "request" and
            .errorCode == "AUTHENTICATION_REQUIRED" and
            .retryable == false
          ' /tmp/executor-auth.json

          curl --silent --output /tmp/executor-invalid.json \
            --write-out '%{http_code}' \
            --request POST http://127.0.0.1:3002/execute-tool \
            --header 'Content-Type: application/json' \
            --header 'Authorization: Bearer ci-executor-key' \
            --data-binary '{' | grep --quiet '^400$'
          jq --exit-status '
            .success == false and
            .errorStage == "request" and
            .errorCode == "INVALID_REQUEST" and
            .retryable == false and
            (.executionTimeMs | type == "number")
          ' /tmp/executor-invalid.json

          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 120 \
            --request POST http://127.0.0.1:3002/execute-tool \
            --header 'Content-Type: application/json' \
            --header 'Authorization: Bearer ci-executor-key' \
            --data '{
              "packageName":"@tpmjs/tools-normalize-whitespace",
              "name":"normalizeWhitespaceTool",
              "version":"0.2.0",
              "params":{"text":"hello   world"}
            }' > /tmp/executor-success.json
          jq --exit-status '
            .success == true and
            .output.text == "hello world" and
            (.executionTimeMs | type == "number")
          ' /tmp/executor-success.json

          curl --silent --output /tmp/executor-missing-export.json \
            --write-out '%{http_code}' \
            --request POST http://127.0.0.1:3002/execute-tool \
            --header 'Content-Type: application/json' \
            --header 'Authorization: Bearer ci-executor-key' \
            --data '{
              "packageName":"@tpmjs/tools-normalize-whitespace",
              "name":"missingTool",
              "version":"0.2.0",
              "params":{}
            }' | grep --quiet '^404$'
          jq --exit-status '
            .success == false and
            .errorStage == "load" and
            .errorCode == "TOOL_NOT_FOUND" and
            .retryable == false and
            (.executionTimeMs | type == "number")
          ' /tmp/executor-missing-export.json

  architecture:
    needs: validation_provenance
    if: ${{ always() && (github.event_name != 'push' || needs.validation_provenance.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm check-architecture

  deadcode:
    needs: validation_provenance
    if: ${{ always() && (github.event_name != 'push' || needs.validation_provenance.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find dead code
        run: pnpm find-deadcode
