name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: github.repository_owner == 'tpmjs'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Restore release build cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-release-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-release-build-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release policy
        run: |
          pnpm release:audit:test
          pnpm release:auth:test
          pnpm release:build:test

      - name: Audit release provenance
        run: pnpm release:audit --format json --output release-audit.json

      - name: Verify npm trusted-publishing authorization
        run: pnpm release:auth --audit release-audit.json --output release-auth.json

      - name: Upload release preflight evidence
        if: ${{ always() && hashFiles('release-audit.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-${{ github.sha }}
          path: |
            release-audit.json
            release-auth.json
          if-no-files-found: error

      - name: Install OIDC-capable npm client
        run: npm install --global npm@11.18.0

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish:ci
          version: pnpm changeset:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
