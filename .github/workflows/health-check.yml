name: Daily Health Check

on:
  # NOTE: automatic triggers disabled 2026-06-13 — uncomment below to re-enable
  # schedule:
  #   # Run daily at 2am UTC
  #   - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  health-check:
    if: github.repository_owner == 'tpmjs'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger health check sync
        run: |
          curl -X POST "${{ secrets.VERCEL_PRODUCTION_URL }}/api/sync/health-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -f -s -S -w "\nHTTP Status: %{http_code}\n"
