name: Sync NPM Metrics

# NOTE (2026-07-18): schedule removed — the full-fleet sweep (237 packages x
# npm downloads + GitHub stars) was hammering both APIs hourly into 429s and,
# with per-batch pacing added, now runs long enough to risk Cloudflare's ~100s
# proxied-response cutoff. Downloads data only changes daily anyway. The
# schedule now lives on-box (tpmjs-cron.service in donto-infra, daily, against
# 127.0.0.1:3200). This workflow remains for manual dispatch only.
on:
  workflow_dispatch:

jobs:
  sync-metrics:
    if: github.repository_owner == 'tpmjs'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger metrics sync
        run: |
          curl -X POST "https://tpmjs.com/api/sync/metrics" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -f -s -S -w "\nHTTP Status: %{http_code}\n"
