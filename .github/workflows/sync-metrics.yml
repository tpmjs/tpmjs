name: Sync NPM Metrics

on:
  # NOTE: automatic triggers disabled 2026-06-13 — uncomment below to re-enable
  # schedule:
  #   # Run every hour
  #   - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-metrics:
    if: github.repository_owner == 'tpmjs'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger metrics sync
        run: |
          curl -X POST "${{ secrets.VERCEL_PRODUCTION_URL }}/api/sync/metrics" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -f -s -S -w "\nHTTP Status: %{http_code}\n"
